<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente IA Programadora</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #334155; }
    #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .user { background: #2563eb; color: #fff; align-self: flex-end; }
    .bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border: 1px solid #334155; }
    pre { background: #020617; padding: 10px; border-radius: 8px; overflow-x: auto; font-family: monospace; }
    #input-box { display: flex; padding: 10px; background: #1e293b; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; }
    button { padding: 12px 18px; border: none; background: #10b981; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <header>🤖 Mi IA Programadora</header>

  <div id="chat">
    <div class="msg bot">¡Hola! Soy tu asistente de código. ¿Qué programa o script quieres crear hoy?</div>
  </div>

  <div id="input-box">
    <input type="text" id="userInput" placeholder="Escribe tu consulta de código...">
    <button onclick="enviar()">Enviar</button>
  </div>

  <script>
    async function enviar() {
      const input = document.getElementById('userInput');
      const chat = document.getElementById('chat');
      const texto = input.value.trim();

      if (!texto) return;

      // Dibujar mensaje del usuario
      chat.innerHTML += `<div class="msg user">${texto}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      // Indicador de "Pensando..."
      const tempId = "loader-" + Date.now();
      chat.innerHTML += `<div class="msg bot" id="${tempId}">Pensando...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        // Petición a la API alternativa
        const promptSistema = "Eres una IA programadora experta. Responde directamente con explicación breve y código limpio.";
        const url = `https://text.pollinations.ai/${encodeURIComponent(promptSistema + "\n\nUsuario: " + texto)}?model=mistral`;

        const res = await fetch(url);
        const respuestaTexto = await res.text();
        
        // Formatear bloque de código simple
        const textoFormateado = respuestaTexto.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        document.getElementById(tempId).innerHTML = textoFormateado;

      } catch (err) {
        document.getElementById(tempId).innerText = "Error de conexión con la IA. Inténtalo de nuevo.";
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
